version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: causalfunnel_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=analytics_db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: causalfunnel_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/analytics_db
      - NODE_ENV=production
    depends_on:
      - mongodb

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: causalfunnel_dashboard
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
